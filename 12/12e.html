<!DOCTYPE html>
<html>
  <head>
    <title>12e</title>
    <style>
        div {
          font-family: Arial;
        } 
      .container{
        border-width: 1px;
        border-color: grey;
        border-radius: 5px;
        border-style: solid;
        max-width: 300px;
      }
      .flexbox{
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding-top: 6px;
        padding-bottom: 6px;
        padding-left: 12px;
        padding-right: 12px;
      }
      .notifications{
        font-weight: bold;
        color: white;
        border-radius: 20px;
        border-style: none;
        background-color: rgb(53, 100, 255);
        padding: 3px 10px 3px 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="flexbox">
        <div>Home</div>
        <div class="notifications">14</div>
      </div>
      <div class="flexbox">
        <div>Notifications</div>
        <div class="notifications">3</div>
      </div >
      <div class="flexbox">
        <div>Messages</div>
        <div class="notifications">5</div>
      </div>
    </div>
  </body>
</html>

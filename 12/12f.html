<!DOCTYPE html>
<html>
  <head>
    <title>12f</title>
    <style>
      div{
        font-family: Arial;
      }
      .header{
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        max-width: 800px;
        align-items: center;

        background-color: rgb(120, 82, 178);
        padding: 8px;
      }
      .home{
        font-weight: bold;
        color: white;
      }
      input{
        width: 500px;
        border: none;
        margin-top: 6px;
        margin-bottom: 6px;
        height: 30px;
        border-radius: 15px;
        padding-left: 20px;
            }
      .download{
        color: white;
        background-color: rgb(120, 82, 178);
        padding: 8px 15px 8px 15px;
        border-style: solid;
        border-color: white;
        border-radius: 2px;
        border-width: 1px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="home">
        Home
      </div>
      <input type="text" placeholder="Search">
      <button class="download">
        Download
      </button>
    </div>
  </body>
</html>

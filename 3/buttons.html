<button class="youtube">
  SUBSCRIBE
</button>
<button class="join">
  JOIN
</button>

<button class="tweet">
  Tweet
</button>


<style>
 .youtube{
  color: white;
  background-color: rgb(245, 13, 13);
  padding: 10px 10px 10px 10px;
  border: none;
  height: 35px;
  width: 120px;
  border-radius: 2px;
  cursor: pointer;
  margin-right: 5px;
  transition: opacity 300ms;
 }
 .youtube:hover{
  opacity: 0.7;
 }
 .youtube:active{
  opacity: 0.5;
 }

 .join{
  background-color: white;
  color: rgb(6, 95, 212);
  border: 1px solid rgb(6, 95, 212);
  padding: 9px 15px;
  cursor: pointer;
  transition: background-color 0.15s, color 0.15s;
  margin-right: 5px;
 }
 .join:hover{
  background-color: rgb(6, 95, 212);
  color: white;
 }
 .join:active{
  opacity: 0.7;
 }

 .tweet{
  background-color: rgb(24, 170, 255);
  color: white;
  border: none;
  height: 36px;
  width: 80px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 15;
  cursor: pointer;
  transition: box-shadow 0.15s;
 }
 .tweet:hover{
  box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
 }
</style>

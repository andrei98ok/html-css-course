<button class="stretch">
  Stretch
</button>

<style>
  .stretch{
    background-color: green;
    color: white;
    font-weight: bold;
    padding: 6px 10px 6px 10px;
    border: none;
    transition: padding 300ms;
    cursor: pointer;
  }
  .stretch:hover{
    padding: 12px 20px 12px 20px;
  }
</style>

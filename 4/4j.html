<button class="click">
  Click
</button>

<style>
  .click{
    background-color: green;
    color: white;
    font-weight: bold;
    padding: 6px 10px 6px 10px;
    border: none;
    transition: margin 100ms, box-shadow 100ms;
    cursor: pointer;
    box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.671);;
  }
  .click:active{
    margin-left: 3px;
    margin-top: 3px;
    box-shadow: none;
  }
</style>

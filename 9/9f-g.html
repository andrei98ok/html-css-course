<!DOCTYPE html>
<html>
  <head>
    <title></title>
    <style>
      p {
        font-family: Arial;
        margin-top: 0;
        margin-bottom: 0;
      }


      .profile{
        width: 200px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        margin-right: 15px;
        display: inline-block;
      }
      .picture{
        width: 200px;
        height: 200px;
        object-fit: cover;
        margin-bottom: 12px;
      }

      .name{
        font-weight: bold;
        margin-left: 8px;
        margin-bottom: 4px;
        font-size: 18px;
      }
      .friends{
        color: grey;
        margin-left: 8px;
        margin-bottom: 12px;
      }
      .add-friend{
        color: white;
        text-align: center;
          margin-left: 8px;
        margin-bottom: 10px;
        background-color: rgb(0, 110, 255);
        padding: 5px 10px 5px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="profile">
      <img class="picture" src="/imgs/cat.jpg" alt="">
      <p class="name">
        Oliver
      </p>
      <p class="friends">
        2 mutual friends
      </p>
      <button class="add-friend">
        Add Friend
      </button>
    </div>
    <div class="profile">
      <img class="picture" src="/imgs/cat2.jpg" alt="">
      <p class="name">
        Mimi
      </p>
      <p class="friends">
        3 mutual friends
      </p>
      <button class="add-friend">
        Add Friend
      </button>
    </div>
    <div class="profile">
      <img class="picture" src="/imgs/dog.jpg" alt="">
      <p class="name">
        Rex
      </p>
      <p class="friends">
        4 mutual friends
      </p>
      <button class="add-friend">
        Add Friend
      </button>
    </div>
  </body>
</html>

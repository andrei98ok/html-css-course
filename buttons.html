<!DOCTYPE html>
<html>
  <title>Buttons</title>
  <head>
  <style>
 .youtube{
  padding: 10px 16px;
  color: white;
  background-color: rgb(204, 0, 0);
  padding: 10px 10px 10px 10px;
  border: none;
  border-radius: 2px;
  cursor: pointer;
  margin-right: 5px;
  margin-left: 5px;
  transition: opacity 300ms;
  vertical-align: top;
 }
 .youtube:hover{
  opacity: 0.7;
 }
 .youtube:active{
  opacity: 0.5;
 }

 .join{
  background-color: white;
  color: rgb(6, 95, 212);
  border: 1px solid rgb(6, 95, 212);
  padding: 9px 15px;
  cursor: pointer;
  transition: background-color 0.15s, color 0.15s;
  margin-right: 5px;
  margin-left: 5px;
  vertical-align: top;
 }
 .join:hover{
  background-color: rgb(6, 95, 212);
  color: white;
 }
 .join:active{
  opacity: 0.7;
 }

 .tweet{
  background-color: rgb(24, 170, 255);
  color: white;
  border: none;
  padding: 7px 16px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  transition: box-shadow 0.15s;
  margin-right: 5px;
  margin-left: 5px;
  vertical-align: top;
 }
 .tweet:hover{
  box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
 }
</style></head>
  <body>
<button class="youtube">
  SUBSCRIBE
</button>
<button class="join">
  JOIN
</button>

<button class="tweet">
  Tweet
</button>
  </body>
</html>
